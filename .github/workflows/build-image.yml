---
name: Build image

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - .github/build-image/Dockerfile
      - .github/workflows/build-image.yml
      - vendor/frontend
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./vendor/frontend/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Read Node.js version
        id: node
        run: echo "version=$(<vendor/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .github/build-image
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }}
          tags: |
            ghcr.io/timmo001/home-assistant-demo-starter-build:latest
            ghcr.io/timmo001/home-assistant-demo-starter-build:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
